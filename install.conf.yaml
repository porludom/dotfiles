- defaults:
    link:
      glob: true
      create: true
      relink: true
      force: true
    shell:
      stdin: true
      stdout: true
      stderr: true

- clean: ["~"]

- shell:
    - description: Prepare shared Codex config directory
      command: test -w /etc/codex || sudo install -d -o "$(id -un)" /etc/codex

- link:
    ~/:
      path: home/.*

    ~/.codex/skills/dev-flow:
      path: codex/skills/dev-flow
      glob: false
      force: false

    ~/.codex/AGENTS.md:
      path: codex/AGENTS.md
      glob: false
      force: false

    ~/.codex/keybindings.json:
      path: codex/keybindings.json
      glob: false
      force: false

    /etc/codex/config.toml:
      path: codex/config.toml
      glob: false
      force: false
      relink: false

- create:
    ~/dev:

- shell:
    - description: Update packet managers
      command: source scripts/bootstrap && update_linux && install_clt && install_homebrew

    - description: Install software
      command: source scripts/bootstrap && install_software

    - description: Install python
      command: source scripts/bootstrap && install_python 3.12

    - description: Setup macos
      command: source scripts/bootstrap && setup_macos

    - description: Install shared VS Code preferences with local overrides
      command: if [ "$(uname)" = Darwin ]; then python3 vscode/install.py --enable-sync; fi

    - source scripts/bootstrap && on_finish
