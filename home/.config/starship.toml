"$schema" = "https://starship.rs/config-schema.json"

format = "$username$directory$hostname$git_branch$git_commit$git_state$git_status$python$direnv$cmd_duration$jobs$status$fill$time$line_break$character"
add_newline = true
command_timeout = 500

[hostname]
ssh_only = true
format = "at [$hostname]($style)[$ssh_symbol](yellow) "
ssh_symbol = " SSH"
style = "cyan"

[git_branch]
symbol = ""
only_attached = true

[git_commit]
only_detached = true
format = '[@$hash]($style) '
style = "bold purple"

[git_state]
format = '[$state( $progress_current/$progress_total)]($style) '
rebase = "REBASE"
merge = "MERGE"

[git_status]
format = '([$all_status$ahead_behind]($style))'
style = "yellow"
conflicted = '!${count} '
staged = '+${count} '
modified = '~${count} '
untracked = '?${count} '
renamed = '»${count} '
deleted = '-${count} '
stashed = 'stash:${count} '
ahead = '↑${count} '
behind = '↓${count} '
diverged = '↑${ahead_count} ↓${behind_count} '

[python]
format = '([py:$virtualenv]($style) )'
style = "green"
generic_venv_names = [".venv", "venv"]

[direnv]
disabled = false
format = '([$allowed]($style) )'
allowed_msg = ""
not_allowed_msg = "env:blocked"
denied_msg = "env:denied"

[cmd_duration]
min_time = 2000
format = '[$duration]($style) '

[jobs]
symbol_threshold = 1
number_threshold = 1
format = '[jobs:$number]($style) '

[status]
disabled = false
format = '[exit:$status]($style) '

[fill]
symbol = " "

[time]
disabled = false
time_format = "%I:%M %p"
format = "[$time](dimmed white)"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
