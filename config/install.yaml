setup-macos:
  title: macOS settings
  description: Touch ID for sudo and Finder, Dock and keyboard preferences
  extras:
    - sudo-touch-id
    - macos-defaults
  settings:
    touch_id:
      enabled: true
      path: /etc/pam.d/sudo_local
      template: /etc/pam.d/sudo_local.template
    defaults:
      - defaults -currentHost write com.apple.controlcenter Bluetooth -int 18
      - defaults -currentHost write com.apple.controlcenter Sound -int 18
      - defaults write com.apple.dock scroll-to-open -bool true
      - defaults write com.apple.dock showAppExposeGestureEnabled -bool true
      - defaults write com.apple.dock mru-spaces -bool false
      - defaults write com.apple.dock wvous-bl-corner -int 5
      - defaults write com.apple.dock wvous-bl-modifier -int 0
      - defaults write -g NSAutomaticPeriodSubstitutionEnabled -bool false
      - defaults write -g NSAutomaticQuoteSubstitutionEnabled -bool false
      - defaults write ru.keepcoder.Telegram AutomaticQuoteSubstitutionEnabledTGGrowingTextView -bool false
      - defaults write NSGlobalDomain ApplePressAndHoldEnabled -bool false
      - defaults write NSGlobalDomain AppleShowAllExtensions -bool true
      - defaults write com.apple.finder FXEnableExtensionChangeWarning -bool false
      - defaults write com.apple.finder AppleShowAllFiles -bool true
      - defaults write com.apple.finder ShowPathbar -bool true
      - defaults write com.apple.finder _FXShowPosixPathInTitle -bool true
      - defaults write com.apple.finder _FXSortFoldersFirst -bool true
    restart:
      - Dock
      - Finder

setup-development:
  title: Development
  description: Neovim, tmux, direnv and Docker
  brew:
    - direnv                      # https://direnv.net
    - neovim                      # https://neovim.io
    - tmux                        # https://github.com/tmux/tmux/wiki
  cask:
    - docker-desktop              # https://docker.com

setup-codex:
  title: Codex
  description: Codex CLI, instructions and configuration
  cask:
    - codex                       # https://openai.com/codex
  link:
    - source: config/codex/AGENTS.md
      destination: .codex/AGENTS.md
    - source: config/codex/keybindings.json
      destination: .codex/keybindings.json
  extras:
    - codex
  settings:
    shared: config/codex/config.toml
    destination: ~/.codex/config.toml
    backups: ~/.local/state/dotfiles/codex/backups
    baseline: ~/.local/state/dotfiles/codex/baseline.toml
    # Each list is a TOML key path; * matches one key component.
    local_only:
      - [projects]
      - [marketplaces]
      - [notify]
      - [model_catalog_json]
      - [model_instructions_file]
      - [cli_auth_credentials_store]
      - [mcp_servers, '*', command]
      - [mcp_servers, '*', args]
      - [mcp_servers, '*', cwd]
      - [mcp_servers, '*', env]
      - [mcp_servers, '*', http_headers]
      - [mcp_servers, '*', bearer_token]
      - [model_providers, '*', http_headers]
      - [model_providers, '*', experimental_bearer_token]
      - [desktop, worktree-repository-preferences]
      - [desktop, custom_file_handlers]
      - [desktop, migratedFollowUpQueueToSteer]
      - [tui, screen_reader_detection_done]
      - [tui, model_availability_nux]

