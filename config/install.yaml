setup-vscode:
  title: VS Code
  description: application, settings, shortcuts and extensions
  cask:
    - visual-studio-code          # https://code.visualstudio.com
  extras:
    - vscode
  brew:
    - duti                        # https://github.com/moretension/duti
  settings:
    shared: config/vscode
    private: ~/.dotfiles_secret/vscode/settings.local.jsonc
    user: ~/Library/Application Support/Code/User
    extensions: ~/.vscode/extensions/extensions.json
    baseline: vscode/extensions.json
    backups: .private/backups/vscode
    cli: /Applications/Visual Studio Code.app/Contents/Resources/app/bin/code
    extension_timeout_seconds: 600
    layout_keys:
      - Comments.hidden
      - menu.hiddenCommands
      - refactorPreview.hidden
      - tabs-list-width-horizontal
      - terminal.hidden
      - terminal.integrated.tabs.showDetailed
      - views.customizations
      - workbench.activity.pinnedViewlets2
      - workbench.activityBar.location
      - workbench.auxiliarybar.pinnedPanels
      - workbench.panel.alignment
      - workbench.panel.pinnedPanels
      - workbench.statusbar.hidden
    file_associations:
      - duti -s com.microsoft.VSCode public.plain-text all
      - duti -s com.microsoft.VSCode public.source-code all
      - duti -s com.microsoft.VSCode public.shell-script all
      - duti -s com.microsoft.VSCode public.json all
      - duti -s com.microsoft.VSCode public.yaml all
      - duti -s com.microsoft.VSCode net.daringfireball.markdown all

setup-iterm:
  title: iTerm
  description: application, profiles, shortcuts and fonts
  cask:
    - iterm2                      # https://iterm2.com
    - font-fira-code              # https://github.com/tonsky/FiraCode
    - font-fira-code-nerd-font    # https://github.com/ryanoasis/nerd-fonts/tree/master/patched-fonts/FiraCode
  extras:
    - iterm
  settings:
    domain: com.googlecode.iterm2
    process: iTerm2
    shared: config/iterm2
    destination: ~/Library/Application Support/iTerm2/DynamicProfiles/dotfiles.json
    backups: .private/backups/iterm2
    theme_cache: iterm2/themes
    theme_library: https://raw.githubusercontent.com/mbadolato/iTerm2-Color-Schemes/b84cd1e68c9033d967fccd9febbac3072d127b7b/schemes/
    theme_timeout_seconds: 15

settings:
  sync:
    state: ~/.local/state/dotfiles
    label: com.dotfiles.sync
    agent: ~/Library/LaunchAgents/com.dotfiles.sync.plist
    interval_seconds: 14400
    run_at_load: true
